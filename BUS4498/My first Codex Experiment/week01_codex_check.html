<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUS 4498 — My First Codex Experiment</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #17324d;
      --blue: #2f6f9f;
      --light-blue: #eef6fb;
      --green: #237a57;
      --border: #d6e2ea;
      --text: #263746;
      --muted: #607483;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #f5f9fc, #e6f0f6);
    }

    .card {
      width: min(100%, 620px);
      padding: 40px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 14px 35px rgba(23, 50, 77, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: clamp(1.7rem, 4vw, 2.35rem);
      line-height: 1.2;
    }

    .name {
      margin: 0 0 28px;
      color: var(--blue);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .status {
      margin: 0 0 24px;
      padding: 14px 16px;
      border-left: 4px solid var(--green);
      border-radius: 6px;
      background: #f0faf5;
      color: var(--green);
      font-weight: 700;
    }

    h2 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: 1.15rem;
    }

    ul {
      margin: 0 0 28px;
      padding: 0;
      list-style: none;
    }

    li {
      margin: 10px 0;
      padding: 12px 14px 12px 40px;
      position: relative;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--light-blue);
    }

    li::before {
      content: "✓";
      position: absolute;
      left: 14px;
      color: var(--green);
      font-weight: 700;
    }

    button {
      width: 100%;
      padding: 13px 18px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: var(--navy);
    }

    button:focus-visible {
      outline: 3px solid #9bc7e3;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>BUS 4498 — My First Codex Experiment</h1>
    <p class="name">Chloe Westberg</p>

    <p class="status" id="statusMessage" role="status">Codex setup complete</p>

    <h2>Setup checks</h2>
    <ul>
      <li>ChatGPT Edu account connected</li>
      <li>BUS4498_My First Codex Experiment project created</li>
      <li>Codex successfully created this webpage</li>
    </ul>

    <button id="readyButton" type="button">Ready for BUS 4498</button>
  </main>

  <script>
    document.getElementById("readyButton").addEventListener("click", function () {
      document.getElementById("statusMessage").textContent =
        "Success! My first Codex experiment works.";
    });
  </script>
</body>
</html>
